# Smoke (no backend writes): a fresh install lands on Welcome behind the auth gate, reaches
# Sign up / Sign in / Forgot password, and on-device validation runs before any request is sent.
# (File name kept from Phase 0M; the tab shell is behind sign-in, see flows/backend/.)
# Targets the development build (cc.toolmint.triply.dev) with Metro running.
appId: cc.toolmint.triply.dev
name: Smoke - signed-out entry and auth screens
tags:
  - smoke
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: welcome-screen
    timeout: 30000
# The tabs are guarded: nothing of the signed-in app is reachable.
- assertNotVisible:
    id: discover-screen
- tapOn:
    id: welcome-sign-up
- assertVisible:
    id: sign-up-screen
# On-device validation: an invalid email and a short password never reach Supabase.
- tapOn:
    id: auth-email
- inputText: not-an-email
- tapOn:
    id: auth-password
- inputText: short
- tapOn:
    id: auth-submit
- assertVisible: Enter a valid email address.
- assertVisible: Use at least 8 characters.
- assertNotVisible:
    id: verify-email-screen
- tapOn:
    id: link-sign-in
- assertVisible:
    id: sign-in-screen
- tapOn:
    id: link-forgot-password
- assertVisible:
    id: reset-email-screen
- tapOn:
    id: header-back
- assertVisible:
    id: sign-in-screen
- tapOn:
    id: link-sign-up
- assertVisible:
    id: sign-up-screen
- tapOn:
    id: header-back
- assertVisible:
    id: welcome-screen
