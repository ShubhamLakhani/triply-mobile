# Onboarding for a CONFIRMED account that has never completed onboarding, up to the photos
# step (Pre-3M: interests 3-8, a gender preference and a photo are all required):
#   maestro test -e TRIPLY_E2E_EMAIL=... -e TRIPLY_E2E_PASSWORD=... \
#     tests/e2e/maestro/flows/backend/onboarding-fresh-account.yaml
# Adding the photo goes through the system photo picker, which Maestro cannot drive reliably:
# add one by hand, then run onboarding-finish.yaml (same app session).
appId: cc.toolmint.triply.dev
name: Backend - onboarding up to the photos step
tags:
  - backend
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: welcome-screen
    timeout: 30000
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: auth-email
- inputText: ${TRIPLY_E2E_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${TRIPLY_E2E_PASSWORD}
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible:
      id: onboarding-profile
    timeout: 25000
# Step 1: name, 18+ date of birth, gender.
- tapOn:
    id: field-first-name
- eraseText
- inputText: Maya
- tapOn:
    id: field-dob-day
- inputText: '07'
- tapOn:
    id: field-dob-month
- inputText: '03'
- tapOn:
    id: field-dob-year
- inputText: '1994'
- hideKeyboard
- tapOn:
    id: field-gender-woman
- tapOn:
    id: onboarding-profile-primary
# Never a detour through the tabs after the profile save.
- extendedWaitUntil:
    visible:
      id: onboarding-interests
    timeout: 20000
- assertNotVisible:
    id: discover-screen
# Step 2: at least 3 interests (catalog shipped by migration M-01).
- tapOn:
    id: interest-hiking
- tapOn:
    id: interest-yoga
- tapOn:
    id: interest-coffee
- tapOn:
    id: onboarding-interests-primary
- extendedWaitUntil:
    visible:
      id: onboarding-preferences
    timeout: 20000
# Step 3: "Everyone" stores every canonical gender value.
- tapOn:
    id: pref-genders-everyone
- tapOn:
    id: onboarding-preferences-primary
- extendedWaitUntil:
    visible:
      id: onboarding-photos
    timeout: 20000
- assertVisible:
    id: photo-add
